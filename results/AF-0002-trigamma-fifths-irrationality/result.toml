id = "AF-0002"
slug = "trigamma-fifths-irrationality"
title = "The irrationality of $\\psi_1(k/5)-\\pi^2/2$: a candidate proof with separated L\\\"owner determinants"
version = "0.1.0"
date = "2026-11-26"
# Preprint: complete written argument, certificates reproduced, Lean development in
# preparation. The archive does not establish the main theorem until level V4.
status = "preprint"
summary = "A candidate proof, released as a preprint, that xi_k = psi_1(k/5) - pi^2/2 is irrational for k = 1, 2, 3, 4 (psi_1 the trigamma function; psi_1(1/2) = pi^2/2). The proof uses Loewner (divided-difference) determinants of psi(z + k/5) - psi(z + 1/2) on h common nodes and h/8 border nodes, in the framework of S. Litsey, with the border rows separated from the border columns: an Andreief-Cauchy factorization divides every determinant by exactly 2^{m(m-1)}, m = h/16, without changing odd-prime valuations, a net gain of (log 2)/256 per h^2. A two-layer p-adic bound for the denominators and a logarithmic-energy bound on a contour, both completed by computer-assisted certificates that have been reproduced, give the comparison with a certified margin of 0.00075448 per h^2. Several steps have not been independently verified; in Lean the main theorem is proved only conditionally on the estimates."
