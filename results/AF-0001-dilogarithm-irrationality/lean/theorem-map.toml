# Manuscript-level statements and their Lean counterparts.
# formal = "proved"      : unconditional Lean theorem (axioms: propext, Classical.choice, Quot.sound)
#          "conditional" : Lean theorem taking the listed unproved hypotheses as arguments
#          "missing"     : not formalized (the listed Lean object is where it enters as a hypothesis)

[[statement]]
manuscript = "Main theorem: Li2(2/11) is irrational"
lean = "AxiomForge.Dilogarithm.irrational_dilog_two_elevenths_of_estimates"
formal = "conditional"
hypotheses = ["HankelEstimates (2/11) <4,6,1> (-4.338/16) (-4.9/16)"]

[[statement]]
manuscript = "Main theorem: Li2(2/9) is irrational"
