id = "AF-0001"
slug = "dilogarithm-irrationality"
title = "Enlarged Hankel determinants and the irrationality of Li₂(2/11), Li₂(2/9), Li₂(−2/9) and Li₂(−2/7)"
version = "0.1.0"
date = "2026-11-26"
# Preprint: complete written argument, certificates reproduced, Lean development in
# preparation. The archive does not establish the main theorem until level V4.
status = "preprint"
summary = "A candidate proof, released as a preprint, that the four numbers Li_2(2/11), Li_2(2/9), Li_2(-2/9) and Li_2(-2/7) are irrational. These values lie below the ranges covered by the published and the recent preprint literature; elementary arguments (Landen's identity) only show that each of the pairs {Li_2(2/11), Li_2(-2/9)} and {Li_2(2/9), Li_2(-2/7)} contains an irrational number. The proof uses normalised Hankel determinants of an affine moment functional attached to the weight D_{Bn}(x)^3/D_{Cn}(x), of dimension Hn, and three estimates for the resulting integer polynomials: a lower bound for their content (prime by prime, integrated with the prime number theorem), an upper bound for their value at the dilogarithm (Heine's formula and logarithmic energy, on the real axis or on two rays), and nonvanishing at prime indices (reduction to explicit local Hankel determinants). The finite computations are certified in exact rational and ball arithmetic and have been reproduced. The general arguments have not been independently verified; in Lean the main theorem is proved only conditionally on the three estimates."
template_version = "1.0.0"
msc_primary = "11J72"
msc_secondary = ["33B30", "31A15"]
