id = "AF-0005"
slug = "legendre-chi-quadratic-unit-irrationality"
title = "Irrationality of chi2 and Ti2 at units of real quadratic fields: further traces"
version = "0.1.0"
date = "2026-11-26"
# Preprint: complete written argument, certificates reproduced, Lean development in
# preparation. The archive does not establish the main theorem until level V4.
status = "preprint"
summary = "A conditional candidate proof, released as a preprint. For an integer n and a sign sigma let z = 2/(n + sqrt(n^2 + 4 sigma)), a unit of norm -sigma of a real quadratic field, and let T_sigma(n) be the value at z of Legendre's chi function chi_2 if sigma = +1 and of the inverse tangent integral Ti_2 if sigma = -1. Krisman proved, in an unrefereed preprint, that these numbers are irrational outside 47 and 57 explicit values of n, and named two improvements of his local estimates that he did not prove. We prove both (at an odd prime dividing n the denominators have no cost beyond the one forced by the valuation of n; at the prime 2, for odd n, the cost is half of the proved one). ASSUMING four results of Krisman's unrefereed preprint, which are stated explicitly and not reproved (his bound for the other odd primes, his bound at 2 for even n, his size estimate for even h >= 100 and his nonvanishing lemma for primes l >= 7 with l not dividing n and l^2 not dividing the denominator), and using four new certificates for the size estimate, T_sigma(n) is irrational for both signs, every even n >= 14 and every odd n >= 27; this covers 31 of the 47 and 42 of the 57 excluded values. The finite computations were redone by separate implementations. The work has not been independently verified, depends on the unrefereed preprint, and in Lean the main theorem is proved only conditionally."
template_version = "1.0.0"
msc_primary = "11J72"
msc_secondary = ["33B30"]
