[[theorem]]
key = "thm:main"
statement = "ASSUMING the four results (K1)-(K4) of Krisman's unrefereed preprint (Hexagon 2611.00265v1: K1 Theorem 3.7, the bound 4/3 h^2 at the odd primes not dividing n; K2 Proposition 4.2, the bound at the prime 2 for even n; K3 Theorem 5.1, the size estimate by a dual energy, for even h >= 100; K4 Lemmas 6.1 and 8.6, the nonvanishing lemma, for primes l >= 7 with l not dividing n and l^2 not dividing b where T = a/b): let sigma be +1 or -1 and n an even integer >= 14 or an odd integer >= 27; then T_sigma(n) is irrational, where T_sigma(n) = chi_2(z) for sigma = +1 and Ti_2(z) for sigma = -1, z = 2/(n + sqrt(n^2 + 4 sigma)); the same holds at -z since chi_2 and Ti_2 are odd. The statement is conditional on (K1)-(K4) (K2 only for even n), none of which is reproved here."
