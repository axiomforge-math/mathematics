statement = "For every odd integer q >= 81 the numbers chi_2(2/q) and Ti_2(2/q) are irrational, where chi_2(x) = sum_{j>=0} x^{2j+1}/(2j+1)^2 and Ti_2(x) = sum_{j>=0} (-1)^j x^{2j+1}/(2j+1)^2; since both are odd, the same holds for chi_2(-2/q) and Ti_2(-2/q)."
