title = "Irrationality of chi2(2/q) and Ti2(2/q) for odd q >= 81: a candidate proof"
version = "0.1.0"
date = "2026-11-26"
# Preprint: complete written argument, certificates reproduced, Lean development in
# preparation. The archive does not establish the main theorem until level V4.
status = "preprint"
summary = "A candidate proof, released as a preprint, that chi_2(2/q) and Ti_2(2/q) are irrational for every odd integer q >= 81, and hence also at -2/q (chi_2 is Legendre's chi function, Ti_2 the inverse tangent integral). The best previously claimed range, in an unrefereed and primarily AI-generated preprint, is odd q >= 175 for chi_2(2/q); the criterion of David, Hirata-Kohno and Kawashima applies at -4/q^2 as well and should give a threshold of the same order for Ti_2(2/q), which we have not computed and have not found stated. The approximations are Hankel determinants of a moment functional with poles at the negative half-integers, with 7/6 times as many poles as rows and, for q = 81, a band of double zeros on the positive axis. The proof needs a parity-separated bound at the prime 2, a residue-class profile for the ordinary primes and a nonvanishing argument at prime indices; its finite inequalities (margins at least 0.006862 per h^2 for q >= 83 and 0.005678 for q = 81) have been reproduced by separately written checkers. The argument has not been independently verified; in Lean the main theorem is proved only conditionally on the estimates."
