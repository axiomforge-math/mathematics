[[theorem]]
key = "thm:main"
statement = "Let a be in {3, 4, 5, 8} and q an odd integer prime to a. (i) chi_2(a/q) is irrational if q >= q_+(a), with q_+(3) = 131, q_+(4) = 995, q_+(5) = 829, q_+(8) = 12061. (ii) Ti_2(a/q) is irrational if q >= q_-(a), with q_-(3) = 257, q_-(4) = 995, q_-(5) = 1609, q_-(8) = 12061. Here chi_2(x) = sum_{j>=0} x^{2j+1}/(2j+1)^2 and Ti_2(x) = sum_{j>=0} (-1)^j x^{2j+1}/(2j+1)^2; both are odd, so the same holds at -a/q."
lean = ""
